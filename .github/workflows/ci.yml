name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les jobs Python installent les versions de `requirements.lock.txt`, comme l'image
# Docker. Sans cela, `pip install -e ".[dev]"` prenait les versions du jour : la CI
# validait alors un environnement que ni le conteneur ni le rendu n'utiliseront, et
# une nouvelle version de ruff ou de NumPy pouvait faire echouer une PR sans rapport.
# `--no-deps` empeche pip de remplacer une version figee pour satisfaire pyproject ;
# `pip check` echoue si le fichier fige ne respecte plus les bornes de pyproject.
# Les dernieres versions restent surveillees a part, par derive-dependances.yml.

jobs:
  qualite:
    name: Style et format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Installer les versions figees
        run: |
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
          pip check
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  tests:
    name: Tests et invariants physiques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Installer les versions figees
        run: |
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
          pip check

      - name: Suite de tests
        run: pytest -m "not slow" --cov=viscocrowd --cov-report=term-missing

      # Les invariants physiques sont rejoues isolement : si la CI casse, le
      # journal doit dire immediatement si c'est le style, un test unitaire, ou
      # la PHYSIQUE qui a regresse. Les trois ne se corrigent pas pareil.
      - name: Invariants physiques
        run: pytest -m invariant -v

      - name: Criteres de validation du moteur
        run: python -m viscocrowd.cli valider-moteur

  reproductibilite:
    name: Reproductibilite des figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Installer les versions figees
        run: |
          pip install -r requirements.lock.txt
          pip install --no-deps -e .
          pip check

      - name: Produire les figures
        run: python -m viscocrowd.cli valider-moteur --figures --sortie figures

      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          retention-days: 30

  # La commande de reproductibilite promise par le README et la spec passe par
  # `make` DANS l'image. Rien ne l'exercait : ni la CI, qui appelle Python
  # directement, ni les tests. Le defaut de l'issue #18 a donc pu vivre tant
  # qu'on ne l'a pas lue. Ce job echoue si la commande documentee cesse de
  # fonctionner, ce qui est le seul moment utile pour l'apprendre.
  conteneur:
    name: Reproductibilite dans le conteneur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'image n'a ni depot ni git : le commit construit lui est transmis, pour que
      # les archives produites dans le conteneur restent rattachees a leur code.
      - name: Construire l'image
        run: docker build --build-arg VISCOCROWD_COMMIT=${{ github.sha }} -t viscocrowd:ci .

      # `make valider` est la commande que documentent le README et la spec.
      # Elle appelle $(VISCO_PY), que l'image fixe a `python` faute de .venv.
      - name: Rejouer la validation par make, dans l'image
        run: docker run --rm viscocrowd:ci make valider

      - name: Verifier la commande par defaut de l'image
        run: docker run --rm viscocrowd:ci

      - name: Executer une configuration et relire la trajectoire dans l'image
        run: |
          docker run --rm viscocrowd:ci sh -c '
            viscocrowd simuler experiments/bille_boite.yaml --sortie /tmp/bille.npz &&
            python -c "from viscocrowd.io.trajectoires import lire_trajectoire; t = lire_trajectoire(\"/tmp/bille.npz\"); print(t.x.shape, t.metadonnees[\"code\"]); assert t.metadonnees[\"code\"][\"commit\"] == \"${{ github.sha }}\""
          '
