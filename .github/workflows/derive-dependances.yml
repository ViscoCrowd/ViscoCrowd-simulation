name: Derive des dependances

# `requirements.lock.txt` fige les versions, ce qui garantit qu'une execution
# d'aujourd'hui redonnera les memes chiffres en janvier. C'est exactement ce
# qu'exigent les consignes, et il ne faut rien y changer.
#
# Mais ce gel a un angle mort : il nous protege sans nous PREVENIR. Si NumPy
# 2.4 change un comportement dont nous dependons, nous ne l'apprendrons qu'au
# premier `pip install` sans contrainte — typiquement sur le poste de quelqu'un
# qui reinstalle le projet, et au pire moment, c'est-a-dire juste avant le rendu
# du 5 janvier 2027.
#
# Ce job rejoue donc la validation avec les versions LES PLUS RECENTES, une fois
# par mois. Il ne protege rien : il previent. Un echec ici ne casse aucune
# branche et n'empeche aucune fusion, il dit seulement que l'ecosysteme a bouge
# et qu'il faudra regarder avant de regenerer quoi que ce soit.

on:
  schedule:
    # Le 1er de chaque mois a 6 h UTC. Assez tot pour que la derive se decouvre
    # en semaine de travail, assez rare pour ne pas polluer les notifications.
    - cron: "0 6 1 * *"
  # Declenchable a la main, par exemple avant de regenerer les figures du rapport.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dernieres-versions:
    name: Validation avec les dernieres versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Volontairement SANS requirements.lock.txt : tout l'interet est de voir
      # ce que donnent les versions que pip choisirait aujourd'hui.
      - name: Installer sans le fichier de versions figees
        run: pip install -e ".[dev]"

      - name: Versions reellement installees
        run: pip freeze

      - name: Tests et invariants physiques
        run: pytest -m "not slow"

      # Le critere qui compte : les NOMBRES publies doivent tenir leurs seuils.
      # La commande rend 1 des qu'un seul deborde.
      - name: Criteres de validation du moteur
        run: python -m viscocrowd.cli valider-moteur

      - name: Que faire si ce job echoue
        if: failure()
        run: |
          echo "::warning::Une dependance a change de comportement."
          echo "Le depot n'est PAS casse : requirements.lock.txt le protege."
          echo "A faire : comparer 'pip freeze' ci-dessus au fichier de versions"
          echo "figees, identifier la bibliotheque en cause, et decider avant de"
          echo "regenerer les figures du rapport."
