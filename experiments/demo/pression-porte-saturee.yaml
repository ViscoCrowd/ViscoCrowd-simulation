# Démonstration de la carte de pression (#164) : PAS la référence.
# Porte de 0,8 m, 150 baigneurs, panique 2, SANS régulation vitesse-espacement : la foule se
# comprime devant la porte et des arches se forment. Sur la référence régulée, presque aucun
# contact n'apparaît (98e centile 1,4 m/s^2).
# Usage : viscocrowd pression experiments/demo/pression-porte-saturee.yaml --image sorties/pression.png --instant 35
version: 1
scenario: piscine
graine: 20262027
parametres:
  geometrie:
    longueur_bassin: 25.0      # m
    largeur_bassin: 12.5       # m
    plage_gauche: 3.0          # m
    plage_verticale: 4.0       # m, en haut et en bas
    plage_sortie: 20.0         # m, du bord du bassin au mur de la porte
    largeur_porte: 0.8         # m, porte saturee
    profondeur_porte: 1.0      # m, couloir de la porte avant l'exterieur
    largeur_mouillee: 3.0      # m, bande de carrelage mouille autour du bassin
    pas_rebord: 0.6            # m, un site de rebord par intervalle
    largeur_echelle: 0.5       # m
    echelles: [[haut, 0.9], [bas, 0.9]]   # cote, fraction de sa longueur
  n_agents: 150
  rayon: 0.2                   # m
  espacement: 1.0              # m entre emplacements initiaux
  bruit: 0.1                   # m, perturbation bornee
  parametres_milieux:
    EAU:                       # petit bain de 0,7 m, eau calme : V = 0,53 (d^2/2)^-0,19 (shirvani2020)
      relaxation: 0.5          # s (Helbing et al. 2000)
      acceleration_max: 1.67   # m/s^2 : 0,34 g x poids apparent ~0,5 (hypothese) ;
                               # 1,6 provisoire jusqu'a la relance du 13 novembre 2026
      vitesse: 0.69            # m/s
    MOUILLE:
      relaxation: 0.5
      acceleration_max: 3.3    # 0,34 g (Kendzior 2023)
      vitesse: 1.34            # m/s (Weidmann 1993, p. 43)
    SEC:
      relaxation: 0.5
      acceleration_max: 5.9    # 0,60 g (Kendzior 2023)
      vitesse: 1.34
  facteur_vitesse: 2.0         # panique forte
  temps_espacement: null       # sans regulation : la foule se comprime
  durees:                      # s, hypotheses non sourcees, balayees en E4
    rebord: 4.0
    echelle: 2.0
  portee: 0.25                 # m : on saisit le bord a moins d'une demi-echelle
  deblocage:                   # #127 : un nageur bloque pres d'un site libre finit par le saisir
    delai: 2.0                 # s immobile avant de tendre le bras (hypothese, sans source)
    portee: 0.65               # m : un diametre plus la portee, a bout de bras
    vitesse: 0.001             # m/s : en dessous, le nageur est tenu pour immobile
  dt: 0.005                    # s, exige par la panique 2
  duree: 180.0                 # s, borne ; le calcul s'arrete quand tous sont sortis
  tolerance: 1.0e-6            # m
  pas_guidage: 0.1             # m
