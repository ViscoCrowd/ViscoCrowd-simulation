services:
  viscocrowd:
    build:
      context: .
      args:
        # Commit enregistre dans les archives produites par l'image :
        #   VISCOCROWD_COMMIT=$(git rev-parse HEAD) docker compose build
        VISCOCROWD_COMMIT: ${VISCOCROWD_COMMIT:-}
    image: viscocrowd:0.1.0
    working_dir: /app
    volumes:
      # Les figures produites dans le conteneur atterrissent directement dans
      # le depot, pretes a etre reprises par le rapport.
      - ./figures:/app/figures
      - ./report/figures:/app/report/figures
      - ./data:/app/data
    environment:
      MPLBACKEND: Agg
      # Cf. Dockerfile : le Makefile appelle $VISCO_PY, et l'image n'a pas de .venv.
      VISCO_PY: python
